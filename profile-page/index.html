<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="description" content="Personal profile page with a photo, an audio introduction and a short video.">

  <body>
    <header>

      <img src="images/divider.svg" alt="" width="400" height="20">

      <section>

      <section>
